<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarDeal Chat</title><style>:root{--bg:#08101e;--card:#101a2d;--muted:#9baac5;--text:#edf3ff;--blue:#57b7ff;--green:#43d17b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top left,#183459,#08101e 48%);color:var(--text);min-height:100vh}header{text-align:center;padding:36px 16px 14px}h1{font-size:30px;margin:0 0 8px}.badge{font-size:11px;color:#a8f5c8;border:1px solid #287a4a;padding:4px 8px;border-radius:999px}.sub{margin:auto;max-width:550px;color:var(--muted);line-height:1.5}main{max-width:980px;margin:10px auto 35px;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(16,26,45,.92);border:1px solid #243653;border-radius:16px;padding:18px;box-shadow:0 14px 35px #0005}h2{margin:0 0 12px;font-size:18px}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:13px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #30425f;background:#091323;color:var(--text);font-size:15px}.row,.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks label{display:flex;align-items:center;gap:8px;color:var(--text);margin:0}.checks input{width:auto;accent-color:var(--blue)}.actions{display:flex;gap:10px;margin-top:18px}button{flex:1;padding:12px;border-radius:10px;border:1px solid #30425f;background:#17253b;color:var(--text);font-weight:bold;cursor:pointer}button.primary{background:linear-gradient(135deg,#57b7ff,#37d58e);border:0;color:#052033}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.car{background:#091323;border:1px solid #263a58;border-radius:12px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}.title{font-weight:bold;line-height:1.35}.meta{font-size:12px;color:var(--muted);line-height:1.7}.tags span{display:inline-block;background:#14365c;color:#b7dcff;font-size:11px;border-radius:999px;padding:3px 7px;margin:3px 3px 0 0}.price{color:#9ef4bf;font-size:17px;font-weight:bold;margin-bottom:8px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px 8px}a{display:block;text-align:center;text-decoration:none;color:#b7dcff;border:1px dashed #4776a3;border-radius:8px;padding:8px;font-size:12px}@media(max-width:760px){main{grid-template-columns:1fr}.row,.checks{grid-template-columns:1fr}header{padding-top:26px}}</style></head><body><header><h1>CarDeal Chat <span class="badge">ALBERTA DEMO</span></h1><p class="sub">Find a used car that fits your budget. Choose your preferences and see matches from our sample Alberta inventory.</p></header><main><section class="card"><h2>Tell us about your ideal car</h2><label for="budget">Maximum budget (CAD)</label><input id="budget" type="number" min="5000" step="500" placeholder="Example: 25000"><div class="row"><div><label for="body">Body type</label><select id="body"><option value="">Any</option><option>SUV</option><option>Sedan</option><option>Truck</option></select></div><div><label for="city">City</label><select id="city"><option value="">Anywhere in Alberta</option><option>Calgary</option><option>Edmonton</option><option>Red Deer</option></select></div></div><label>Must-have features</label><div class="checks"><label><input type="checkbox" value="awd"> AWD / 4WD</label><label><input type="checkbox" value="camera"> Backup camera</label><label><input type="checkbox" value="carplay"> CarPlay / Android Auto</label><label><input type="checkbox" value="low"> Low km under 70,000</label></div><div class="actions"><button id="reset">Reset</button><button class="primary" id="find">Find my cars</button></div></section><section class="card"><div class="head"><h2>Recommended cars</h2><span id="count" class="count">0 matches</span></div><div id="results" class="grid"><div class="empty">Choose your preferences, then tap “Find my cars.”</div></div></section></main><script>const cars=[['2018 Honda CR-V EX','SUV',23900,78000,'Calgary',['awd','camera']],['2019 Toyota RAV4 XLE','SUV',26500,62000,'Edmonton',['awd','camera','carplay']],['2017 Mazda CX-5 GS','SUV',19900,95000,'Calgary',['awd']],['2016 Honda Civic EX','Sedan',16900,88000,'Edmonton',['camera']],['2018 Toyota Corolla LE','Sedan',17900,72000,'Calgary',['camera','carplay']],['2015 Ford F-150 XLT','Truck',22900,120000,'Red Deer',['awd']],['2020 Hyundai Kona Preferred','SUV',21900,45000,'Calgary',['awd','camera','carplay']],['2017 Nissan Rogue SV','SUV',18500,98000,'Edmonton',['awd','camera']]];const el=id=>document.getElementById(id);function render(data){el('count').textContent=data.length+' match'+(data.length===1?'':'es');el('results').innerHTML=data.length?data.map(c=>'<article class="car"><div><div class="title">'+c[0]+'</div><div class="meta">'+c[1]+' · '+c[3].toLocaleString()+' km<br>'+c[4]+', AB</div><div class="tags">'+c[5].map(x=>'<span>'+({awd:'AWD',camera:'Backup camera',carplay:'CarPlay',low:'Low km'}[x])+'</span>').join('')+'</div></div><div><div class="price">$'+c[2].toLocaleString()+' CAD</div><a href="#" onclick="alert(\'Demo listing — connect real inventory later.\');return false;">View demo listing</a></div></article>').join(''):'<div class="empty">No matches. Try a higher budget or fewer required features.</div>'}el('find').onclick=()=>{let budget=+el('budget').value||Infinity,body=el('body').value,city=el('city').value,features=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value);let data=cars.filter(c=>c[2]<=budget&&(!body||c[1]===body)&&(!city||c[4]===city)&&features.every(f=>f==='low'?c[3]<70000:c[5].includes(f))).sort((a,b)=>a[2]-b[2]);render(data)};el('reset').onclick=()=>{el('budget').value='';el('body').value='';el('city').value='';document.querySelectorAll('.checks input').forEach(x=>x.checked=false);el('count').textContent='0 matches';el('results').innerHTML='<div class="empty">Choose your preferences, then tap “Find my cars.”</div>'}</script></body></html>
